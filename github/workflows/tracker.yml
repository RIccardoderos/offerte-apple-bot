name: Amazon Price Tracker

on:
  schedule:
    # Esegue lo script automaticamente ogni 15 minuti
    - cron: '*/15 * * * *'
  # Permette di avviarlo anche manualmente quando vuoi
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione delle dipendenze
        run: |
          pip install requests beautifulsoup4

      - name: Esecuzione dello script di scraping
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python AmazonTraker.py